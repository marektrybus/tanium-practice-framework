[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
    "api: tests requiring a real HTTP API",
    "unit: isolated tests without network access",
    "ui: browser-based end-to-end tests",
    "local_api: tests of the locally owned Todo API",
    "integration: tests spanning multiple application layers",
]

[tool.ruff.lint.isort]
known-first-party = ["api", "utils"]

[tool.coverage.run]
concurrency = ["greenlet"]
